name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm nasm clang-format clang-tidy
      - name: Check formatting
        run: make check-format
      - name: clang-tidy
        run: make lint

  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm nasm gcc make python3 qemu-system-x86 ovmf mtools
      - name: Build
        run: make -j"$(nproc)" CONFIG=${{ matrix.config }}
      - name: Test
        run: make test CONFIG=${{ matrix.config }}
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: minios-${{ matrix.config }}
          path: |
            build/${{ matrix.config }}/*.img
            build/${{ matrix.config }}/*.elf
            build/${{ matrix.config }}/logs/
          if-no-files-found: ignore
